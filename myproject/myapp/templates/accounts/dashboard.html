
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e2548, #063808);
        }

        .dashboard-container {
            width: 400px;
            padding: 45px 35px;
            background: #cb4040;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            color: #333;
            font-size: 27px;
            margin-bottom: 12px;
        }

        .username {
            color: #764ba2;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .welcome-text {
            color: #888;
            font-size: 15px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #343d62, #198b67);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 450px) {
            .dashboard-container {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <h2>Welcome!</h2>

        <p class="welcome-text">Hello, nice to see you again</p>

        <h2 class="username">{{ user.username }}</h2>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    </div>

</body>
</html>
